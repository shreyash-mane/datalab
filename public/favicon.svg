<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="flask-clip">
      <path d="M13.5 6.5 L13.5 15.5 L8.5 23.5 C7.2 25.8 8.8 28 11.5 28 L20.5 28 C23.2 28 24.8 25.8 23.5 23.5 L18.5 15.5 L18.5 6.5 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Flask body outline filled white -->
  <path d="M13.5 6.5 L13.5 15.5 L8.5 23.5 C7.2 25.8 8.8 28 11.5 28 L20.5 28 C23.2 28 24.8 25.8 23.5 23.5 L18.5 15.5 L18.5 6.5 Z"
        fill="white" opacity="0.92"/>

  <!-- Liquid fill clipped to flask -->
  <rect x="7" y="20.5" width="18" height="9" rx="0" fill="url(#liquid)" opacity="0.75" clip-path="url(#flask-clip)"/>

  <!-- Flask neck opening bar -->
  <rect x="11.5" y="5" width="9" height="2.5" rx="1.2" fill="white" opacity="0.80"/>

  <!-- Bubble 1 -->
  <circle cx="15.5" cy="18" r="1.1" fill="white" opacity="0.55"/>
  <!-- Bubble 2 -->
  <circle cx="18" cy="15.5" r="0.7" fill="white" opacity="0.40"/>
</svg>
